		<script>
			function getParameterByName(name, url) {
				if (!url) url = window.location.href;
				name = name.replace(/[\[\]]/g, '\\$&');
				var regex = new RegExp('[?&]' + name + '(=([^&#]*)|&|#|$)'),
					results = regex.exec(url);
				if (!results) return null;
				if (!results[2]) return '';
				return decodeURIComponent(results[2].replace(/\+/g, ' '));
			}

			var success = getParameterByName('success') === "true";
			var message = getParameterByName('message');
			var outputElement = document.getElementById('conditional-output');

			if (success) {
				outputElement.innerHTML= "<h3>Thank you!</h3>" +
					"<div class='alert alert--success'>" +
						"Your account is now active."
					"</div>";
			} else {
				outputElement.innerHTML= "<h3>There has been an error</h3>" +
					"<div class='alert alert--error'>" +
						message +
					"</div>";
			}

			// Global nav:
			var urlForLoginButton = getParameterByName("redirect"); //this redirect parameter comes from the querystring parameter on the "resultUrl" octo variable, which adds is used on the verify email json to redirect to after the user verifies their email.
			var global_nav_config = {
				header: {
					search: false,
					auth: {
					environment: "live",
					provider: "idam",
					links: [{ text: "Sign in", url: urlForLoginButton }]
					}
				}
			};
		</script>
